<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narrated Slides</title>
<style>
  :root { --fg: #f4efe6; --muted: #cfc6b8; --hi: #ffcf6e; --panel: rgba(12, 9, 7, 0.62); --bg: #0d0a08; }
  :root[data-theme="light"] { --fg: #f4efe6; --muted: #cfc6b8; --hi: #ffcf6e; --panel: rgba(12, 9, 7, 0.62); --bg: #0d0a08; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 18px/1.55 Georgia, "Times New Roman", serif; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
  #stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity;
               opacity: 0; transition: opacity 600ms ease; user-select: none; pointer-events: none; }
  #stage img.on { opacity: 1; }
  #stage img.lit { opacity: 0; transition: none; }
  #shade { position: fixed; inset: 0; pointer-events: none;
           background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.7)); }
  #title { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px;
           font: 600 15px/1.3 system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  #panel { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom));
           max-width: 44rem; margin: 0 auto; background: var(--panel); border-radius: 12px; padding: 14px 18px;
           backdrop-filter: blur(3px); max-height: 45vh; overflow-y: auto; }
  #panel span { cursor: pointer; border-radius: 3px; transition: color 120ms; }
  #panel span.now { color: var(--hi); }
  #panel span.done { color: var(--fg); }
  #panel span.todo { color: var(--muted); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         display: flex; gap: 10px; align-items: center; font: 15px system-ui, sans-serif; }
  #bar button { font: 15px system-ui, sans-serif; color: var(--fg); background: rgba(255,255,255,0.12);
                border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 8px 14px; min-width: 44px; }
  #pos { flex: 1; min-width: 60px; accent-color: var(--hi); }
  #time { color: var(--muted); font-size: 13px; white-space: nowrap; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; font: 16px system-ui, sans-serif; color: var(--muted); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="shade"></div>
<div id="title"></div>
<div id="panel" hidden></div>
<div id="bar">
  <button id="prev" aria-label="Previous block">⏮</button>
  <button id="play" aria-label="Play">▶</button>
  <button id="next" aria-label="Next block">⏭</button>
  <input id="pos" type="range" min="0" max="1000" value="0" aria-label="Position">
  <span id="time">0:00</span>
</div>
<div id="msg">Loading…</div>
<script type="module">
// A narrated slide show (a basic comic) from a playback script with a visual track:
// ?script=b04 plays book 4 of the overview series (looked up in its published manifest; &site=<url>
// for another series site), or ?script=<url of a .script.json> plays that script. Each block's picture fills the screen and moves from its start
// crop to its end crop while the narrator reads; the block's words sit on top and light up as spoken.
import { ScriptPlayer, at, wordAt, timeOfWord } from "./engine.js";

const params = new URLSearchParams(location.search);
const SITE = params.get("site") || "https://bonjohen.github.io/lorekiln-overview/";

// A republished picture keeps its file name, so ask the server each time (a cheap check when it
// hasn't changed) instead of trusting the browser's copy, and show it from memory.
async function freshUrl(u) {
  try {
    const res = await fetch(u, { cache: "no-cache" });
    if (!res.ok) return u;
    return URL.createObjectURL(await res.blob());
  } catch (e) { return u; }
}

async function getJson(u) {
  const res = await fetch(u, { cache: "no-cache" });
  if (!res.ok) throw new Error(`couldn't load ${u} (${res.status === 404 ? "not found" : "error " + res.status})`);
  return res.json();
}

// "b04" -> the slide show of book 4 in the series site's manifest; anything else is a script URL.
async function resolveScript(param) {
  const m = /^b(\d+)$/i.exec(param || "");
  if (!m) return param;
  const book = parseInt(m[1], 10);
  const manifest = await getJson(new URL("manifest.json", SITE).href);
  const ch = (manifest.books || []).filter(b => b.book === book).flatMap(b => b.chapters).find(c => c.script);
  if (!ch) throw new Error(`book ${book} has no slide show at ${SITE}`);
  return new URL(ch.script, SITE).href;
}
let url = params.get("script");
const $ = id => document.getElementById(id);
let player, script, base, visuals = [], images = {}, shown = null, spans = [], panelBlock = -1;

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const mix = (a, b, p) => a.map((f, j) => f + (b[j] - f) * p);

// The crop at `rel` seconds into an entry: through its keyframes (the camera that follows the words,
// [{t, box}] in time order), or from `from` to `to` over the entry's length.
function cropAt(v, rel, len) {
  const keys = v.keys;
  if (!keys || !keys.length) return mix(v.from, v.to, ease(Math.max(0, Math.min(1, rel / len))));
  if (rel <= keys[0].t) return keys[0].box;
  for (let j = 0; j < keys.length - 1; j++) {
    const a = keys[j], b = keys[j + 1];
    if (rel < b.t) return b.cut ? a.box : mix(a.box, b.box, ease((rel - a.t) / (b.t - a.t)));   // a cut: hold, then switch
  }
  return keys[keys.length - 1].box;
}

// Spotlight and focus pull (keys with "move"): which effect is on at `rel` seconds into an entry, how
// strongly (s, 0 to 1, ramping in after its key and out before a key without it), and on which ellipse
// ([cx, cy, rx, ry], fractions of the picture; a run of spotlights glides from one thing to the next).
const RAMP_S = 0.35, GLIDE_S = 0.3;
function effectAt(v, rel) {
  const keys = v.keys;
  if (!keys) return null;
  let j = -1;
  for (let i = 0; i < keys.length; i++) if (keys[i].t <= rel) j = i;
  const k = keys[j];
  if (!k || !k.move) return null;
  const prev = keys[j - 1], next = keys[j + 1], same = prev && prev.move === k.move;
  let s = same ? 1 : Math.min(1, (rel - k.t) / RAMP_S);
  if (next && next.move !== k.move) s = Math.min(s, (next.t - rel) / RAMP_S);
  const spot = same ? mix(prev.spot, k.spot, ease(Math.min(1, (rel - k.t) / GLIDE_S))) : k.spot;
  return { move: k.move, spot, s: ease(Math.max(0, Math.min(1, s))) };
}

// The picture dims (spotlight) or blurs (focus) and a copy of it, masked to a soft ellipse, stays clear on top.
function applyEffect(img, e, scale) {
  const lit = img.lit;
  if (!e || e.s < 0.001) { img.style.filter = ""; lit.style.opacity = 0; return; }
  const IW = img.naturalWidth, IH = img.naturalHeight, [cx, cy, rx, ry] = e.spot;
  img.style.filter = e.move === "spotlight" ? `brightness(${(1 - 0.6 * e.s).toFixed(3)})`
    : `blur(${(6 * e.s / scale).toFixed(2)}px) brightness(${(1 - 0.12 * e.s).toFixed(3)})`;
  lit.style.webkitMaskImage = lit.style.maskImage =
    `radial-gradient(ellipse ${rx * IW}px ${ry * IH}px at ${cx * IW}px ${cy * IH}px, #000 60%, transparent 100%)`;
  lit.style.width = img.style.width;
  lit.style.transform = img.style.transform;
  lit.style.opacity = 1;
}

function itemIndex(t) { return player.plan.items.indexOf(at(player.plan, t)); }

// Place an image so the crop [x, y, w, h] (fractions) covers the screen, centred.
function place(img, crop) {
  const VW = innerWidth, VH = innerHeight, IW = img.naturalWidth, IH = img.naturalHeight;
  if (!IW) return;
  const [x, y, w, h] = crop;
  const s = Math.max(VW / (w * IW), VH / (h * IH));
  let tx = VW / 2 - s * (x + w / 2) * IW, ty = VH / 2 - s * (y + h / 2) * IH;
  tx = Math.min(0, Math.max(VW - s * IW, tx));          // never show past the picture's edge
  ty = Math.min(0, Math.max(VH - s * IH, ty));
  img.style.width = IW + "px";
  img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  return s;
}

// The block's own text, punctuation and all, with each timed word wrapped where it sits.
function showPanel(k) {
  if (k === panelBlock) return;
  panelBlock = k;
  const seg = script.sequence[k], [a, b] = seg.choose[0].words, panel = $("panel");
  const text = (script.paragraphs.find(q => q.p === script.words[a].p) || {}).text || "";
  panel.textContent = "";
  spans = [];
  let pos = 0;
  for (let i = a; i <= b; i++) {
    const w = script.words[i].w;
    let at = text.indexOf(w, pos);
    if (at < 0) at = text.toLowerCase().indexOf(w.toLowerCase(), pos);
    const s = document.createElement("span");
    if (at < 0) {                                            // not in the text: show the word as timed
      panel.append(" ");
      s.textContent = w;
    } else {
      panel.append(text.slice(pos, at));
      s.textContent = text.substr(at, w.length);
      pos = at + w.length;
    }
    s.dataset.i = i;
    panel.append(s);
    spans[i] = s;
  }
  panel.append(text.slice(pos));
  panel.hidden = false;
  panel.scrollTop = 0;
  $("title").textContent = `${visuals[k].slide} · ${visuals[k].title}`;
}

function frame() {
  if (player && player.plan) {
    const t = Math.min(player.currentTime, player.length - 0.001);
    const k = itemIndex(t), item = player.plan.items[k], v = visuals[k];
    if (v) {
      const img = images[v.image];
      if (shown !== img) {
        if (shown) { shown.classList.remove("on"); applyEffect(shown, null, 1); }
        img.classList.add("on");
        shown = img;
      }
      const scale = place(img, cropAt(v, t - item.start, item.end - item.start));
      applyEffect(img, effectAt(v, t - item.start), scale);
      showPanel(k);
      const now = wordAt(player.plan, t);
      for (const [i, s] of Object.entries(spans)) {
        s.className = +i === now ? "now" : +i < now ? "done" : "todo";
      }
    }
    $("time").textContent = `${fmt(player.currentTime)} / ${fmt(player.length)}`;
    if (!dragging) $("pos").value = Math.round(1000 * player.currentTime / player.length);
  }
  requestAnimationFrame(frame);
}

async function main() {
  if (!url) { $("msg").textContent = "Add ?script=b04 (a book) or ?script=<url of a .script.json>"; return; }
  url = await resolveScript(url);
  script = await getJson(url);
  base = url.slice(0, url.lastIndexOf("/") + 1);
  if (!script.visual) { $("msg").textContent = "This script has no visual track."; return; }
  // One visual per sequence segment, in order (build_slides.py writes them that way).
  const bySeg = Object.fromEntries(script.visual.map(v => [v.start.seg, v]));
  visuals = script.sequence.map(s => bySeg[s.id]);
  for (const v of script.visual) {
    if (images[v.image]) continue;
    const img = new Image();
    img.src = await freshUrl(base + v.image);
    img.alt = "";
    $("stage").append(img);
    const lit = new Image();                       // the clear copy for spotlight and focus pull
    lit.src = img.src;
    lit.alt = "";
    lit.className = "lit";
    $("stage").append(lit);
    img.lit = lit;
    images[v.image] = img;
  }
  await Promise.all(Object.values(images).map(i => i.decode().catch(() => {})));
  player = new ScriptPlayer(script, base, { onEnd: () => { $("play").textContent = "▶"; } });
  $("msg").textContent = "Decoding audio…";
  await player.load();
  $("msg").remove();
  window.player = player;
  requestAnimationFrame(frame);
}

let dragging = false;
$("play").onclick = async () => {
  if (!player) return;
  if (player.playing) { player.pause(); $("play").textContent = "▶"; }
  else { await player.play(); $("play").textContent = "⏸"; }
};
function jump(d) {
  const k = Math.max(0, Math.min(script.sequence.length - 1, itemIndex(player.currentTime) + d));
  player.seek(player.plan.items[k].start);
}
$("prev").onclick = () => player && jump(player.currentTime - player.plan.items[itemIndex(player.currentTime)].start > 2 ? 0 : -1);
$("next").onclick = () => player && jump(1);
$("pos").oninput = () => { dragging = true; };
$("pos").onchange = () => { dragging = false; player && player.seek(player.length * $("pos").value / 1000); };
$("panel").onclick = e => { const i = e.target.dataset && e.target.dataset.i; if (i != null && player) player.seek(timeOfWord(player.plan, +i)); };
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); $("play").click(); } });
main().catch(e => { $("msg").textContent = "Error: " + e.message; console.error("[slides]", e); });
</script>
</body>
</html>
