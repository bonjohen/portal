<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoreKiln — Player (preview)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23e08a3c%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #14110f;
    --panel: #1c1815;
    --line: #2e2823;
    --ink: #e9e1d6;
    --dim: #8e8275;
    --faint: #5c534a;
    --ember: #e08a3c;
    --ember-soft: rgba(224, 138, 60, 0.18);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; height: 100dvh; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-family: var(--serif); font-size: 20px; letter-spacing: 0.02em; }
  .brand b { color: var(--ember); font-weight: normal; }
  #book-select { max-width: 340px; min-width: 0; font-size: 14px; }
  header, .main, footer { min-width: 0; }
  body { grid-template-columns: minmax(0, 1fr); }
  .book-title { color: var(--dim); font-size: 14px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ember); border: 1px solid var(--ember); border-radius: 999px; padding: 2px 9px; }
  .icon-btn { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 12px; min-height: 40px; cursor: pointer; font: inherit; font-size: 14px; }
  .icon-btn:hover { border-color: var(--dim); }
  #toggle-chapters { display: none; }

  .main { display: grid; grid-template-columns: 290px 1fr; min-height: 0; }
  nav {
    border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0; background: var(--bg);
  }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin: 14px 18px 6px; font-weight: 600; }
  nav button {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; gap: 6px;
    width: 100%; text-align: left; background: none; border: 0; color: var(--ink);
    padding: 12px 18px; min-height: 44px; cursor: pointer; font: inherit; font-size: 15px; line-height: 1.3;
  }
  nav button:hover { background: var(--panel); }
  nav button.active { background: var(--ember-soft); }
  nav button .num { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
  nav button.active .num { color: var(--ember); }
  nav button .state { font-size: 11px; color: var(--faint); }
  nav button.noaudio { color: var(--dim); }

  #reader { overflow-y: auto; scroll-behavior: smooth; position: relative; }
  .page { max-width: 720px; margin: 0 auto; padding: 36px 28px 40vh; }
  .media-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .chip { font-size: 12px; border: 1px solid var(--line); color: var(--faint); border-radius: 999px; padding: 4px 11px; }
  .chip.on { border-color: var(--ember); color: var(--ember); }
  .chapter-id { font-size: 12px; letter-spacing: 0.12em; color: var(--faint); font-variant-numeric: tabular-nums; margin-bottom: 6px; overflow-wrap: anywhere; }
  .edition { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .edition[hidden] { display: none; }
  .edition button { background: none; border: 0; color: var(--dim); font: inherit; font-size: 14px; padding: 8px 18px; min-height: 40px; cursor: pointer; }
  .edition button.on { background: var(--ember); color: #1a120a; }
  h1 { font-family: var(--serif); font-weight: normal; font-size: 34px; line-height: 1.2; margin: 0 0 28px; overflow-wrap: anywhere; }
  .text p {
    font-family: var(--serif); font-size: 20px; line-height: 1.75; margin: 0 0 1.1em;
    color: var(--dim); transition: color 0.4s;
  }
  .text p.near { color: #b9ad9f; }
  .text p.current { color: var(--ink); }
  .text.untimed p { color: var(--ink); }
  .w { border-radius: 3px; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .w.sent { color: var(--ink); }
  .w.now { background: var(--ember-soft); color: #fff; box-shadow: 0 0 0 2px var(--ember-soft); }
  .notice { color: var(--dim); font-size: 15px; line-height: 1.5; border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; overflow-wrap: anywhere; }
  .notice.error { color: var(--ink); border-color: var(--ember); border-style: solid; }
  .notice button { margin-top: 8px; }
  .notice code, .text code { font-size: 0.9em; overflow-wrap: anywhere; }

  footer {
    border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
  }
  .controls { display: flex; align-items: center; gap: 6px; }
  .ctl { background: none; border: 0; color: var(--ink); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  .ctl:hover { background: var(--line); }
  .ctl:disabled { color: var(--faint); cursor: default; background: none; }
  .ctl.play { width: 52px; height: 52px; background: var(--ember); color: #1a120a; }
  .ctl.play:hover { background: #f09a4c; }
  .ctl svg { width: 22px; height: 22px; fill: currentColor; }
  .ctl.play svg { width: 24px; height: 24px; }
  .timeline { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; min-height: 32px; accent-color: var(--ember); }
  .extra { display: flex; align-items: center; gap: 10px; }
  select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 40px; font: inherit; font-size: 14px; }
  label.follow { font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; cursor: pointer; min-height: 40px; }
  label.follow input { width: 20px; height: 20px; }

  @media (max-width: 820px) {
    .main { grid-template-columns: 1fr; }
    nav { position: fixed; inset: 61px 0 0 0; z-index: 5; display: none; border-right: 0; }
    nav.open { display: block; }
    #toggle-chapters { display: inline-block; }
    .book-title { display: none; }
    #book-select { flex: 1; max-width: none; }
    .badge { display: none; }
    header { gap: 8px; padding: 10px; }
    .brand { font-size: 17px; }
    .page { padding: 24px 16px 40vh; }
    h1 { font-size: 27px; }
    .text p { font-size: 18px; }
    footer { grid-template-columns: 1fr; gap: 6px; padding: 8px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .controls { justify-content: center; }
    .extra { justify-content: center; }
  }
  @media (max-width: 360px) {
    .brand { display: none; }
    .controls { gap: 2px; }
  }
  @media (prefers-reduced-motion: reduce) { #reader { scroll-behavior: auto; } }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="toggle-chapters" aria-controls="chapters">Chapters</button>
  <div class="brand">Lore<b>Kiln</b></div>
  <select id="book-select" aria-label="Series and book"></select>
  <div class="book-title" id="book-title"></div>
  <span class="badge">Preview</span>
</header>

<div class="main">
  <nav id="chapters" aria-label="Chapters"></nav>
  <main id="reader" tabindex="-1">
    <div class="page">
      <div class="media-strip" id="media-strip"></div>
      <div class="chapter-id" id="chapter-id"></div>
      <div class="edition" id="edition" role="group" aria-label="Edition" hidden>
        <button id="ed-canon" type="button">Canon</button><button id="ed-prime" type="button">Prime</button>
      </div>
      <h1 id="chapter-title">Loading…</h1>
      <div id="notice"></div>
      <div class="text" id="text"></div>
    </div>
  </main>
</div>

<footer>
  <div class="controls">
    <button class="ctl" id="prev" title="Previous chapter" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
    <button class="ctl" id="back" title="Back 10 seconds (Left arrow)" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zm.5-6 8.5 6V6z"/></svg></button>
    <button class="ctl play" id="play" title="Play / pause (Space)" aria-label="Play"><svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ctl" id="fwd" title="Forward 10 seconds (Right arrow)" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6zm9-12v12l8.5-6z"/></svg></button>
    <button class="ctl" id="next" title="Next chapter" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm10-12v12h2V6z"/></svg></button>
  </div>
  <div class="timeline">
    <span id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
    <span id="dur">0:00</span>
  </div>
  <div class="extra">
    <select id="speed" aria-label="Speed">
      <option value="0.75">0.75×</option><option value="0.85">0.85×</option><option value="1" selected>1×</option>
      <option value="1.1">1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
    <label class="follow"><input type="checkbox" id="follow" checked> Follow text</label>
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  // ---------- settings and storage ----------
  const params = new URLSearchParams(location.search);
  const MEDIA = (params.get("media") || "media/").replace(/\/?$/, "/");
  const store = {
    get(k, d) { try { const v = localStorage.getItem("lk." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("lk." + k, JSON.stringify(v)); } catch {} },
  };

  const $ = id => document.getElementById(id);
  const audio = $("audio"), textEl = $("text"), reader = $("reader");
  let manifest = null, book = null, chapter = null, index = -1;
  let words = [];      // [{el, t, g}] in reading order; t = start time, g = highlight group
  let groups = [];     // group id -> [indexes into words]
  let mode = "none";   // "word" | "sentence" | "none"
  let current = -1, userScrollUntil = 0, ownScrollUntil = 0, saveTick = 0, openToken = 0;

  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const norm = w => w.toLowerCase().normalize("NFKD").replace(/[^\p{L}\p{N}]/gu, "");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // Fetch that turns HTTP errors and network failures into one plain sentence.
  async function get(url) {
    let res;
    try { res = await fetch(url); } catch { throw new Error(navigator.onLine === false ? "you're offline" : "the network request failed"); }
    if (!res.ok) throw new Error(res.status === 404 ? "not found (404)" : `the server answered ${res.status}`);
    return res;
  }
  function notice(html, kind = "") { $("notice").insertAdjacentHTML("beforeend", `<div class="notice ${kind}">${html}</div>`); }

  // ---------- books and editions ----------
  // Storage keys: canon keeps the chapter id itself, so positions saved before editions existed still resume.
  const isPrime = b => b.edition === "prime-trial";
  const bookKey = b => `${b.series}${b.book}${isPrime(b) ? ":prime" : ""}`;
  const chapterKey = (b, c) => (isPrime(b) ? "prime:" : "") + c.id;

  function partner(b, ch) {
    if (!manifest || !ch) return null;
    let other;
    if (isPrime(b)) {
      const to = b.compare_to;
      other = to && manifest.books.find(x => !isPrime(x) && x.series === to.series && x.book === to.book);
    } else {
      other = manifest.books.find(x => isPrime(x) && x.compare_to && x.compare_to.series === b.series && x.compare_to.book === b.book);
    }
    if (!other) return null;
    const i = other.chapters.findIndex(c => c.episode === ch.episode);
    return i < 0 ? null : { book: other, index: i };
  }

  // Canon books by title, each followed by its prime trial; prime trials without a canon book go last.
  function orderBooks(books) {
    const canon = books.filter(b => !isPrime(b)).sort((a, b) => a.title.localeCompare(b.title) || a.book - b.book);
    const prime = books.filter(isPrime);
    const out = [];
    for (const c of canon) {
      out.push(c);
      for (const p of prime) if (p.compare_to && p.compare_to.series === c.series && p.compare_to.book === c.book) out.push(p);
    }
    for (const p of prime) if (!out.includes(p)) out.push(p);
    return out;
  }

  // ---------- text ----------
  function inline(s) {
    const e = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return e.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>").replace(/_(\S.*?)_/g, "<em>$1</em>");
  }

  function renderText(md) {
    const lines = md.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    textEl.innerHTML = "";
    words = [];
    lines.forEach((line, pi) => {
      if (pi === 0) return; // title line goes in the heading
      const p = document.createElement("p");
      p.dataset.p = pi;
      // Wrap each word (keeping markup) in a span.
      const html = inline(line.replace(/^#+\s*/, "").replace(/^>\s*/, ""));
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      wrapWords(tmp, p, pi);
      textEl.appendChild(p);
    });
    return lines[0] || "";
  }

  function wrapWords(src, dest, pi) {
    for (const node of [...src.childNodes]) {
      if (node.nodeType === 3) {
        for (const part of node.textContent.split(/(\s+)/)) {
          if (!part) continue;
          if (/^\s+$/.test(part)) { dest.appendChild(document.createTextNode(part)); continue; }
          const span = document.createElement("span");
          span.className = "w";
          span.textContent = part;
          span.dataset.i = words.length;
          words.push({ el: span, n: norm(part), p: pi, t: null, g: null });
          dest.appendChild(span);
        }
      } else {
        const clone = node.cloneNode(false);
        wrapWords(node, clone, pi);
        dest.appendChild(clone);
      }
    }
  }

  // ---------- timings ----------
  function parseAss(txt) {
    const out = [];
    for (const line of txt.split(/\r?\n/)) {
      if (!line.startsWith("Dialogue:")) continue;
      const f = line.slice(9).split(",");
      if (f.length < 10) continue;
      const t = f[1].trim().split(":").map(Number);
      const start = t[0] * 3600 + t[1] * 60 + t[2];
      const text = f.slice(9).join(",").replace(/\{[^}]*\}/g, "").replace(/\\N/g, " ");
      out.push({ start, text });
    }
    return out;
  }

  // Walk the display words and the timed words together; a timed word claims the next
  // display word that matches it within a short lookahead.
  function align(timed) {
    let j = 0;
    for (const tw of timed) {
      const n = norm(tw.w);
      if (!n) continue;
      for (let k = j; k < Math.min(words.length, j + 8); k++) {
        if (words[k].t === null && (words[k].n === n || words[k].n.startsWith(n) || n.startsWith(words[k].n) && words[k].n)) {
          words[k].t = tw.t; words[k].g = tw.g; j = k + 1; break;
        }
      }
    }
    let lastT = 0, lastG = null;
    for (const w of words) {
      if (w.t === null) { w.t = lastT; w.g = lastG; } else { lastT = w.t; lastG = w.g; }
    }
    groups = [];
    words.forEach((w, i) => { if (w.g !== null) (groups[w.g] ||= []).push(i); });
  }

  async function loadTimings(ch) {
    mode = "none";
    try {
      if (ch.timing) {
        const tj = await (await get(ch.timing)).json();
        align(tj.words.filter(w => w.p !== 0).map((w, i) => ({ w: w.w, t: w.t, g: i }))); // p 0 is the title line
        mode = "word";
        return;
      }
      if (ch.ass) {
        const lines = parseAss(await (await get(ch.ass)).text());
        const timed = [];
        lines.forEach((l, gi) => {
          if (gi === 0 && /^Episode\b/i.test(l.text)) return; // the title line is in the heading
          l.text.split(/\s+/).filter(Boolean).forEach(w => timed.push({ w, t: l.start, g: gi }));
        });
        align(timed);
        mode = "sentence";
      }
    } catch (e) { console.warn("timings", e); mode = "none"; }
  }

  // ---------- highlight ----------
  function wordAt(t) {
    let lo = 0, hi = words.length - 1, ans = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (words[mid].t <= t + 0.05) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    return ans;
  }

  function highlight(i) {
    if (i === current) return;
    const prev = words[current];
    if (prev) {
      prev.el.classList.remove("now");
      (groups[prev.g] || []).forEach(k => words[k].el.classList.remove("sent", "now"));
      const pp = prev.el.closest("p");
      if (pp) { pp.classList.remove("current"); pp.previousElementSibling?.classList.remove("near"); pp.nextElementSibling?.classList.remove("near"); }
    }
    current = i;
    const w = words[i];
    if (!w) return;
    if (mode === "word") w.el.classList.add("now");
    (groups[w.g] || []).forEach(k => words[k].el.classList.add(mode === "sentence" ? "now" : "sent"));
    const p = w.el.closest("p");
    if (p) { p.classList.add("current"); p.previousElementSibling?.classList.add("near"); p.nextElementSibling?.classList.add("near"); }
    if ($("follow").checked && Date.now() > userScrollUntil && !document.hidden) {
      const r = w.el.getBoundingClientRect(), box = reader.getBoundingClientRect();
      if (r.top < box.top + box.height * 0.3 || r.bottom > box.top + box.height * 0.6) {
        ownScrollUntil = Date.now() + 1000;
        reader.scrollTo({ top: reader.scrollTop + r.top - box.top - box.height * 0.4 });
      }
    }
  }

  // ---------- chapters ----------
  function buildSelect() {
    const sel = $("book-select");
    sel.innerHTML = "";
    manifest.books.forEach((b, k) => {
      const o = document.createElement("option");
      o.value = k;
      o.textContent = isPrime(b) ? `  ↳ Prime trial (${b.chapters.length})` : `${b.title} (${b.chapters.length})`;
      sel.appendChild(o);
    });
    sel.onchange = () => {
      const b = manifest.books[Number(sel.value)];
      const last = store.get("last." + bookKey(b), null);
      const i = Math.max(0, b.chapters.findIndex(c => chapterKey(b, c) === last));
      openChapter(b, i, false);
    };
  }

  function buildNav(b) {
    const nav = $("chapters");
    nav.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = b.title;
    nav.appendChild(h);
    b.chapters.forEach((ch, i) => {
      const btn = document.createElement("button");
      btn.dataset.key = chapterKey(b, ch);
      if (!ch.audio) btn.classList.add("noaudio");
      btn.innerHTML = `<span class="num">${String(ch.episode).padStart(3, "0")}</span><span></span><span class="state"></span>`;
      btn.children[1].textContent = ch.title || ch.id;
      btn.children[2].textContent = ch.audio ? "" : "text";
      btn.onclick = () => { openChapter(b, i, !audio.paused); nav.classList.remove("open"); };
      nav.appendChild(btn);
    });
  }

  function mediaStrip() {
    const items = [["Audio", true], ["Game · Tue", false], ["RPG · Wed", false], ["Comic · Fri", false]];
    $("media-strip").innerHTML = items.map(([t, on]) => `<span class="chip${on ? " on" : ""}">${t}</span>`).join("");
  }

  function editionSwitch() {
    const pair = partner(book, chapter);
    $("edition").hidden = !pair;
    if (!pair) return;
    $("ed-canon").classList.toggle("on", !isPrime(book));
    $("ed-prime").classList.toggle("on", isPrime(book));
    $("ed-canon").setAttribute("aria-pressed", String(!isPrime(book)));
    $("ed-prime").setAttribute("aria-pressed", String(isPrime(book)));
  }

  // Change edition at the same episode, keeping the same fraction of the chapter (lengths differ).
  function switchEdition(toPrime) {
    if (isPrime(book) === toPrime) return;
    const pair = partner(book, chapter);
    if (!pair) return;
    const frac = audio.duration && isFinite(audio.duration) ? audio.currentTime / audio.duration : null;
    openChapter(pair.book, pair.index, !audio.paused, { frac });
  }

  // opts.frac: start at this fraction of the chapter instead of the saved position.
  // opts.resumeLine: show where the listener will resume.
  async function openChapter(b, i, autoplay, opts = {}) {
    const token = ++openToken;
    savePos();
    $("cur").textContent = "0:00"; $("dur").textContent = "0:00"; $("seek").value = 0;
    if (book !== b) {
      buildNav(b);
      $("book-select").value = manifest.books.indexOf(b);
      $("book-title").textContent = "";
    }
    book = b; index = i; chapter = b.chapters[i];
    const key = chapterKey(b, chapter);
    store.set("last", key);
    store.set("last." + bookKey(b), key);
    const canon = isPrime(b) && b.compare_to ? `${b.compare_to.series}${b.compare_to.book}` : `${b.series}${b.book}`;
    store.set("edition." + canon, isPrime(b) ? "prime-trial" : "canon");
    document.querySelectorAll("nav button").forEach(el => el.classList.toggle("active", el.dataset.key === key));
    const info = [chapter.id];
    if (isPrime(b)) info.push("Prime trial");
    if (chapter.voice) info.push(`voice ${chapter.voice}`);
    if (chapter.speed) info.push(`recorded at ${chapter.speed}×`);
    $("chapter-id").textContent = info.join(" · ");
    $("chapter-title").textContent = chapter.title || chapter.id;
    document.title = `${chapter.title || chapter.id} — ${b.title}`;
    $("prev").disabled = i === 0;
    $("next").disabled = i === b.chapters.length - 1;
    editionSwitch();
    current = -1; words = []; mode = "none";
    $("notice").innerHTML = "";
    if (sourceProblems.length) notice(sourceProblems.join("<br>"));
    textEl.textContent = "Loading…";

    // Audio first: on a locked phone the next chapter has to start inside the "ended" handler,
    // before any network wait, or the browser may refuse to play.
    if (chapter.audio) {
      audio.src = chapter.audio;
      audio.defaultPlaybackRate = audio.playbackRate = Number($("speed").value);
      const saved = store.get("pos." + key, 0);
      audio.addEventListener("loadedmetadata", () => {
        if (token !== openToken) return;
        const d = audio.duration;
        if (opts.frac != null && isFinite(d)) audio.currentTime = Math.min(d - 1, Math.max(0, opts.frac * d));
        else if (saved > 2 && saved < d - 5) audio.currentTime = saved;
      }, { once: true });
      if (autoplay) audio.play().catch(() => {});
      if (opts.resumeLine && store.get("pos." + key, 0) > 2) {
        notice(`Resume: <strong>${esc(chapter.title || chapter.id)}</strong> at ${fmt(saved)}. Press play to continue.`, "resume");
      }
    } else {
      audio.pause();
      audio.removeAttribute("src"); audio.load();
    }
    mediaMeta();

    let body;
    try { body = await (await get(chapter.text)).text(); }
    catch (e) {
      if (token !== openToken) return;
      textEl.innerHTML = "";
      notice(`Couldn't load this chapter's text: ${esc(e.message)}.<br><code>${esc(chapter.text)}</code><br><button class="icon-btn" id="retry-text">Try again</button>`, "error");
      $("retry-text").onclick = () => openChapter(book, index, !audio.paused);
      return;
    }
    if (token !== openToken) return;
    renderText(body);
    if (chapter.audio) {
      await loadTimings(chapter);
      if (token !== openToken) return;
      textEl.classList.toggle("untimed", mode === "none");
      if (mode === "none") notice("No timing file for this chapter, so the text won't follow the audio.");
      else if (!audio.paused) highlight(wordAt(audio.currentTime));
    } else {
      textEl.classList.add("untimed");
      notice("Audio for this chapter isn't ready yet. You can read it here.");
    }
    ownScrollUntil = Date.now() + 1000;
    reader.scrollTo({ top: 0, behavior: "auto" });
  }

  function savePos() {
    if (chapter && chapter.audio && audio.currentTime > 0 && !audio.ended) store.set("pos." + chapterKey(book, chapter), Math.floor(audio.currentTime));
  }

  function step(delta, autoplay) {
    const i = index + delta;
    if (book && i >= 0 && i < book.chapters.length) openChapter(book, i, autoplay);
  }
  function seekBy(sec) {
    if (!audio.duration) return;
    audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + sec));
  }

  // ---------- lock screen and headset (Media Session) ----------
  const ms = "mediaSession" in navigator ? navigator.mediaSession : null;
  function msAction(action, handler) { try { ms.setActionHandler(action, handler); } catch {} } // support varies by action
  function mediaMeta() {
    if (!ms || !chapter) return;
    try {
      ms.metadata = new MediaMetadata({
        title: chapter.title || chapter.id,
        artist: book.title,
        album: `${book.series} · Book ${book.book}`,
      });
    } catch {}
  }
  function positionState() {
    if (!ms || !ms.setPositionState || !audio.duration || !isFinite(audio.duration)) return;
    try { ms.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration) }); } catch {}
  }
  if (ms) {
    msAction("play", () => play());
    msAction("pause", () => audio.pause());
    msAction("seekbackward", d => { seekBy(-((d && d.seekOffset) || 10)); positionState(); });
    msAction("seekforward", d => { seekBy((d && d.seekOffset) || 10); positionState(); });
    msAction("seekto", d => {
      if (d.fastSeek && "fastSeek" in audio) audio.fastSeek(d.seekTime); else audio.currentTime = d.seekTime;
      positionState();
    });
    msAction("previoustrack", () => step(-1, true));
    msAction("nexttrack", () => step(1, true));
  }

  // ---------- controls ----------
  const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  function setPlayIcon() {
    $("play-icon").innerHTML = audio.paused ? PLAY : PAUSE;
    $("play").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
    if (ms) try { ms.playbackState = audio.paused ? "paused" : "playing"; } catch {}
  }
  function play() {
    if (!chapter || !chapter.audio) return;
    if (audio.error) { // a failed load: try the same file again from where we were
      const at = audio.currentTime;
      audio.src = chapter.audio;
      audio.addEventListener("loadedmetadata", () => { if (at > 0) audio.currentTime = at; }, { once: true });
    }
    audio.play().catch(() => {});
  }
  function toggle() { if (!audio.src) return; audio.paused ? play() : audio.pause(); }

  $("play").onclick = toggle;
  $("back").onclick = () => seekBy(-10);
  $("fwd").onclick = () => seekBy(10);
  $("prev").onclick = () => step(-1, !audio.paused);
  $("next").onclick = () => step(1, !audio.paused);
  $("ed-canon").onclick = () => switchEdition(false);
  $("ed-prime").onclick = () => switchEdition(true);
  $("speed").onchange = e => { audio.defaultPlaybackRate = audio.playbackRate = Number(e.target.value); store.set("speed", e.target.value); positionState(); };
  $("follow").onchange = e => store.set("follow", e.target.checked);
  $("toggle-chapters").onclick = () => $("chapters").classList.toggle("open");
  $("seek").oninput = e => { if (audio.duration) audio.currentTime = (e.target.value / 1000) * audio.duration; };
  textEl.addEventListener("click", e => {
    const i = e.target.dataset?.i;
    if (i === undefined || mode === "none" || !audio.src) return;
    audio.currentTime = words[i].t;
    if (audio.paused) play();
  });
  // Following pauses for a few seconds after the listener scrolls by hand (wheel, touch, keys or scrollbar).
  const handScroll = () => { userScrollUntil = Date.now() + 4000; };
  reader.addEventListener("wheel", handScroll, { passive: true });
  reader.addEventListener("touchmove", handScroll, { passive: true });
  reader.addEventListener("scroll", () => { if (Date.now() > ownScrollUntil) handScroll(); }, { passive: true });
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    if (e.code === "ArrowLeft") $("back").click();
    if (e.code === "ArrowRight") $("fwd").click();
  });

  audio.addEventListener("play", () => { setPlayIcon(); positionState(); $("notice").querySelectorAll(".notice.resume").forEach(n => n.remove()); });
  audio.addEventListener("pause", () => { setPlayIcon(); savePos(); positionState(); });
  audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); positionState(); });
  audio.addEventListener("ratechange", positionState);
  audio.addEventListener("seeked", positionState);
  audio.addEventListener("timeupdate", () => {
    $("cur").textContent = fmt(audio.currentTime);
    if (audio.duration) $("seek").value = Math.round((audio.currentTime / audio.duration) * 1000);
    if (mode !== "none" && words.length) highlight(wordAt(audio.currentTime));
    if (++saveTick % 20 === 0) { savePos(); positionState(); }
  });
  audio.addEventListener("ended", () => {
    store.set("pos." + chapterKey(book, chapter), 0);
    if (index < book.chapters.length - 1) openChapter(book, index + 1, true);
  });
  audio.addEventListener("error", () => {
    if (!chapter || !chapter.audio || !audio.getAttribute("src")) return;
    const why = navigator.onLine === false ? "you're offline" : "the file didn't load";
    notice(`Couldn't play this chapter's audio: ${why}. Check your connection, then press play to try again.<br><code>${esc(chapter.audio)}</code>`, "error");
  });
  window.addEventListener("pagehide", savePos);
  window.addEventListener("beforeunload", savePos);
  document.addEventListener("visibilitychange", () => { if (document.hidden) savePos(); });

  // ---------- start ----------
  let sourceProblems = [];
  function fatal(title, html) {
    $("chapter-title").textContent = title;
    textEl.innerHTML = "";
    $("notice").innerHTML = "";
    notice(html, "error");
  }

  // Version-stamp media URLs so a republished episode isn't served from an old cache.
  function stamp(url, v) { return v ? `${url}${url.includes("?") ? "&" : "?"}v=${encodeURIComponent(v)}` : url; }

  async function start() {
    $("speed").value = store.get("speed", "1");
    if (!$("speed").value) $("speed").value = "1";
    $("follow").checked = store.get("follow", true);
    mediaStrip();
    // Sources: ?media=<url> for one media folder; otherwise library.json beside the page
    // ({"sources": ["/lorekiln-roa/", ...]}), each with its own manifest.json; otherwise media/.
    let sources = [MEDIA];
    if (!params.get("media")) {
      try {
        const lib = await fetch("library.json");
        if (lib.ok) sources = (await lib.json()).sources.map(s => s.replace(/\/?$/, "/"));
      } catch {}
    }
    const books = [], failed = [];
    for (const base of sources) {
      try {
        const m = await (await get(base + "manifest.json")).json();
        for (const b of m.books || []) {
          if (!b || !Array.isArray(b.chapters)) continue;
          b.edition ||= "canon";
          b.title ||= `${b.series} Book ${b.book}`;
          for (const c of b.chapters) {
            for (const k of ["text", "audio", "ass", "timing"]) if (c[k]) c[k] = base + c[k];
            for (const k of ["audio", "ass", "timing"]) if (c[k]) c[k] = stamp(c[k], c.audio_version);
          }
          books.push(b);
        }
      } catch (e) {
        console.warn("no manifest at", base, e);
        failed.push(`<code>${esc(base)}manifest.json</code>: ${esc(e.message === "Unexpected end of JSON input" || e instanceof SyntaxError ? "not a valid manifest" : e.message)}`);
      }
    }
    manifest = { books: orderBooks(books) };
    if (!manifest.books.length) {
      const offline = navigator.onLine === false;
      fatal(offline ? "You're offline" : "No books to play yet",
        `<p>Couldn't load a chapter list from:</p><p>${failed.join("<br>") || "the sources listed (they had no books)"}</p>` +
        (offline ? "<p>Reconnect, then reload this page.</p>"
                 : "<p>Try reloading in a minute. If a series site was just switched on, it can take a few minutes to appear.</p>") +
        `<p>On the workstation, run <code>tools\\preview_player.cmd</code>. Anywhere else, add the media location to the address: <code>?media=https://…/</code></p>` +
        `<button class="icon-btn" onclick="location.reload()">Reload</button>`);
      return;
    }
    if (failed.length) sourceProblems = [`Some books are missing because a source didn't load:`, ...failed];
    buildSelect();
    const last = store.get("last", null);
    let b = manifest.books[0], i = 0;
    for (const bk of manifest.books) {
      const k = bk.chapters.findIndex(c => chapterKey(bk, c) === last);
      if (k >= 0) { b = bk; i = k; break; }
    }
    await openChapter(b, i, false, { resumeLine: true });
  }
  start().catch(e => { console.error(e); fatal("Something went wrong", `<p>The player couldn't start: ${esc(e.message)}.</p><button class="icon-btn" onclick="location.reload()">Reload</button>`); });
})();
</script>
</body>
</html>
