<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoreKiln — Player (preview)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23e08a3c%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #14110f;
    --panel: #1c1815;
    --line: #2e2823;
    --ink: #e9e1d6;
    --dim: #8e8275;
    --faint: #5c534a;
    --ember: #e08a3c;
    --ember-soft: rgba(224, 138, 60, 0.18);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-family: var(--serif); font-size: 20px; letter-spacing: 0.02em; }
  .brand b { color: var(--ember); font-weight: normal; }
  #book-select { max-width: 340px; min-width: 0; font-size: 14px; }
  header, .main, footer { min-width: 0; }
  body { grid-template-columns: minmax(0, 1fr); }
  .book-title { color: var(--dim); font-size: 14px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ember); border: 1px solid var(--ember); border-radius: 999px; padding: 2px 9px; }
  .icon-btn { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .icon-btn:hover { border-color: var(--dim); }
  #toggle-chapters { display: none; }

  .main { display: grid; grid-template-columns: 290px 1fr; min-height: 0; }
  nav {
    border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0; background: var(--bg);
  }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin: 14px 18px 6px; font-weight: 600; }
  nav button {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; gap: 6px;
    width: 100%; text-align: left; background: none; border: 0; color: var(--ink);
    padding: 8px 18px; cursor: pointer; font: inherit; font-size: 14px; line-height: 1.3;
  }
  nav button:hover { background: var(--panel); }
  nav button.active { background: var(--ember-soft); }
  nav button .num { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
  nav button.active .num { color: var(--ember); }
  nav button .state { font-size: 11px; color: var(--faint); }
  nav button.noaudio { color: var(--dim); }

  #reader { overflow-y: auto; scroll-behavior: smooth; position: relative; }
  .page { max-width: 720px; margin: 0 auto; padding: 36px 28px 40vh; }
  .media-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .chip { font-size: 12px; border: 1px solid var(--line); color: var(--faint); border-radius: 999px; padding: 4px 11px; }
  .chip.on { border-color: var(--ember); color: var(--ember); }
  .chapter-id { font-size: 12px; letter-spacing: 0.12em; color: var(--faint); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  h1 { font-family: var(--serif); font-weight: normal; font-size: 34px; line-height: 1.2; margin: 0 0 28px; }
  .text p {
    font-family: var(--serif); font-size: 20px; line-height: 1.75; margin: 0 0 1.1em;
    color: var(--dim); transition: color 0.4s;
  }
  .text p.near { color: #b9ad9f; }
  .text p.current { color: var(--ink); }
  .text.untimed p { color: var(--ink); }
  .w { border-radius: 3px; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .w.sent { color: var(--ink); }
  .w.now { background: var(--ember-soft); color: #fff; box-shadow: 0 0 0 2px var(--ember-soft); }
  .notice { color: var(--dim); font-size: 14px; border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 24px; }

  footer {
    border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px 12px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
  }
  .controls { display: flex; align-items: center; gap: 6px; }
  .ctl { background: none; border: 0; color: var(--ink); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  .ctl:hover { background: var(--line); }
  .ctl:disabled { color: var(--faint); cursor: default; background: none; }
  .ctl.play { width: 48px; height: 48px; background: var(--ember); color: #1a120a; }
  .ctl.play:hover { background: #f09a4c; }
  .ctl svg { width: 20px; height: 20px; fill: currentColor; }
  .ctl.play svg { width: 22px; height: 22px; }
  .timeline { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--ember); }
  .extra { display: flex; align-items: center; gap: 10px; }
  select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; }
  label.follow { font-size: 12px; color: var(--dim); display: flex; gap: 5px; align-items: center; cursor: pointer; }

  @media (max-width: 820px) {
    .main { grid-template-columns: 1fr; }
    nav { position: fixed; inset: 53px 0 92px 0; z-index: 5; display: none; border-right: 0; }
    nav.open { display: block; }
    #toggle-chapters { display: inline-block; }
    .book-title { display: none; }
    #book-select { flex: 1; max-width: none; }
    .badge { display: none; }
    header { gap: 8px; padding: 8px 10px; }
    .brand { font-size: 17px; }
    .page { padding: 24px 18px 40vh; }
    h1 { font-size: 27px; }
    .text p { font-size: 18px; }
    footer { grid-template-columns: 1fr; gap: 8px; }
    .controls { justify-content: center; }
    .extra { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { #reader { scroll-behavior: auto; } }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="toggle-chapters" aria-controls="chapters">Chapters</button>
  <div class="brand">Lore<b>Kiln</b></div>
  <select id="book-select" aria-label="Series and book"></select>
  <div class="book-title" id="book-title"></div>
  <span class="badge">Preview</span>
</header>

<div class="main">
  <nav id="chapters" aria-label="Chapters"></nav>
  <main id="reader" tabindex="-1">
    <div class="page">
      <div class="media-strip" id="media-strip"></div>
      <div class="chapter-id" id="chapter-id"></div>
      <h1 id="chapter-title">Loading…</h1>
      <div id="notice"></div>
      <div class="text" id="text"></div>
    </div>
  </main>
</div>

<footer>
  <div class="controls">
    <button class="ctl" id="prev" title="Previous chapter" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
    <button class="ctl" id="back" title="Back 10 seconds (Left arrow)" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zm.5-6 8.5 6V6z"/></svg></button>
    <button class="ctl play" id="play" title="Play / pause (Space)" aria-label="Play"><svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ctl" id="fwd" title="Forward 10 seconds (Right arrow)" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6zm9-12v12l8.5-6z"/></svg></button>
    <button class="ctl" id="next" title="Next chapter" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm10-12v12h2V6z"/></svg></button>
  </div>
  <div class="timeline">
    <span id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
    <span id="dur">0:00</span>
  </div>
  <div class="extra">
    <select id="speed" aria-label="Speed">
      <option value="0.85">0.85×</option><option value="1" selected>1×</option>
      <option value="1.1">1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
    <label class="follow"><input type="checkbox" id="follow" checked> Follow text</label>
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  // ---------- settings and storage ----------
  const params = new URLSearchParams(location.search);
  const MEDIA = (params.get("media") || "media/").replace(/\/?$/, "/");
  const store = {
    get(k, d) { try { const v = localStorage.getItem("lk." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("lk." + k, JSON.stringify(v)); } catch {} },
  };

  const $ = id => document.getElementById(id);
  const audio = $("audio"), textEl = $("text"), reader = $("reader");
  let manifest = null, book = null, chapter = null, index = -1;
  let words = [];      // [{el, t, g}] in reading order; t = start time, g = highlight group
  let groups = [];     // group id -> [indexes into words]
  let mode = "none";   // "word" | "sentence" | "none"
  let current = -1, userScrollUntil = 0, saveTick = 0;

  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const norm = w => w.toLowerCase().normalize("NFKD").replace(/[^\p{L}\p{N}]/gu, "");

  // ---------- text ----------
  function inline(s) {
    const esc = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>").replace(/_(\S.*?)_/g, "<em>$1</em>");
  }

  function renderText(md) {
    const lines = md.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    textEl.innerHTML = "";
    words = [];
    lines.forEach((line, pi) => {
      if (pi === 0) return; // title line goes in the heading
      const p = document.createElement("p");
      p.dataset.p = pi;
      // Wrap each word (keeping markup) in a span.
      const html = inline(line.replace(/^#+\s*/, "").replace(/^>\s*/, ""));
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      wrapWords(tmp, p, pi);
      textEl.appendChild(p);
    });
    return lines[0] || "";
  }

  function wrapWords(src, dest, pi) {
    for (const node of [...src.childNodes]) {
      if (node.nodeType === 3) {
        for (const part of node.textContent.split(/(\s+)/)) {
          if (!part) continue;
          if (/^\s+$/.test(part)) { dest.appendChild(document.createTextNode(part)); continue; }
          const span = document.createElement("span");
          span.className = "w";
          span.textContent = part;
          span.dataset.i = words.length;
          words.push({ el: span, n: norm(part), p: pi, t: null, g: null });
          dest.appendChild(span);
        }
      } else {
        const clone = node.cloneNode(false);
        wrapWords(node, clone, pi);
        dest.appendChild(clone);
      }
    }
  }

  // ---------- timings ----------
  function parseAss(txt) {
    const out = [];
    for (const line of txt.split(/\r?\n/)) {
      if (!line.startsWith("Dialogue:")) continue;
      const f = line.slice(9).split(",");
      if (f.length < 10) continue;
      const t = f[1].trim().split(":").map(Number);
      const start = t[0] * 3600 + t[1] * 60 + t[2];
      const text = f.slice(9).join(",").replace(/\{[^}]*\}/g, "").replace(/\\N/g, " ");
      out.push({ start, text });
    }
    return out;
  }

  // Walk the display words and the timed words together; a timed word claims the next
  // display word that matches it within a short lookahead.
  function align(timed) {
    let j = 0;
    for (const tw of timed) {
      const n = norm(tw.w);
      if (!n) continue;
      for (let k = j; k < Math.min(words.length, j + 8); k++) {
        if (words[k].t === null && (words[k].n === n || words[k].n.startsWith(n) || n.startsWith(words[k].n) && words[k].n)) {
          words[k].t = tw.t; words[k].g = tw.g; j = k + 1; break;
        }
      }
    }
    let lastT = 0, lastG = null;
    for (const w of words) {
      if (w.t === null) { w.t = lastT; w.g = lastG; } else { lastT = w.t; lastG = w.g; }
    }
    groups = [];
    words.forEach((w, i) => { if (w.g !== null) (groups[w.g] ||= []).push(i); });
  }

  async function loadTimings(ch) {
    mode = "none";
    try {
      if (ch.timing) {
        const tj = await (await fetch(ch.timing)).json();
        align(tj.words.filter(w => w.p !== 0).map((w, i) => ({ w: w.w, t: w.t, g: i }))); // p 0 is the title line
        mode = "word";
        return;
      }
      if (ch.ass) {
        const lines = parseAss(await (await fetch(ch.ass)).text());
        const timed = [];
        lines.forEach((l, gi) => {
          if (gi === 0 && /^Episode\b/i.test(l.text)) return; // the title line is in the heading
          l.text.split(/\s+/).filter(Boolean).forEach(w => timed.push({ w, t: l.start, g: gi }));
        });
        align(timed);
        mode = "sentence";
      }
    } catch (e) { console.warn("timings", e); mode = "none"; }
  }

  // ---------- highlight ----------
  function wordAt(t) {
    let lo = 0, hi = words.length - 1, ans = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (words[mid].t <= t + 0.05) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    return ans;
  }

  function highlight(i) {
    if (i === current) return;
    const prev = words[current];
    if (prev) {
      prev.el.classList.remove("now");
      (groups[prev.g] || []).forEach(k => words[k].el.classList.remove("sent"));
      const pp = prev.el.closest("p");
      if (pp) { pp.classList.remove("current"); pp.previousElementSibling?.classList.remove("near"); pp.nextElementSibling?.classList.remove("near"); }
    }
    current = i;
    const w = words[i];
    if (!w) return;
    if (mode === "word") w.el.classList.add("now");
    (groups[w.g] || []).forEach(k => words[k].el.classList.add(mode === "sentence" ? "now" : "sent"));
    const p = w.el.closest("p");
    if (p) { p.classList.add("current"); p.previousElementSibling?.classList.add("near"); p.nextElementSibling?.classList.add("near"); }
    if ($("follow").checked && Date.now() > userScrollUntil) {
      const r = w.el.getBoundingClientRect(), box = reader.getBoundingClientRect();
      if (r.top < box.top + box.height * 0.3 || r.bottom > box.top + box.height * 0.6) {
        reader.scrollTo({ top: reader.scrollTop + r.top - box.top - box.height * 0.4 });
      }
    }
  }

  // ---------- chapters ----------
  function buildSelect() {
    const sel = $("book-select");
    sel.innerHTML = "";
    manifest.books.forEach((b, k) => {
      const o = document.createElement("option");
      o.value = k;
      o.textContent = `${b.title} (${b.chapters.length})`;
      sel.appendChild(o);
    });
    sel.onchange = () => {
      const b = manifest.books[Number(sel.value)];
      const last = store.get("last." + b.series + b.book, null);
      const i = Math.max(0, b.chapters.findIndex(c => c.id === last));
      openChapter(b, i, false);
    };
  }

  function buildNav(b) {
    const nav = $("chapters");
    nav.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = b.title;
    nav.appendChild(h);
    b.chapters.forEach((ch, i) => {
      const btn = document.createElement("button");
      btn.dataset.id = ch.id;
      if (!ch.audio) btn.classList.add("noaudio");
      btn.innerHTML = `<span class="num">${String(ch.episode).padStart(3, "0")}</span><span></span><span class="state"></span>`;
      btn.children[1].textContent = ch.title;
      btn.children[2].textContent = ch.audio ? "" : "text";
      btn.onclick = () => { openChapter(b, i, false); nav.classList.remove("open"); };
      nav.appendChild(btn);
    });
  }

  function mediaStrip() {
    const items = [["Audio", true], ["Game · Tue", false], ["RPG · Wed", false], ["Comic · Fri", false]];
    $("media-strip").innerHTML = items.map(([t, on]) => `<span class="chip${on ? " on" : ""}">${t}</span>`).join("");
  }

  async function openChapter(b, i, autoplay) {
    savePos();
    audio.pause();
    $("cur").textContent = "0:00"; $("dur").textContent = "0:00"; $("seek").value = 0;
    if (book !== b) {
      buildNav(b);
      $("book-select").value = manifest.books.indexOf(b);
      $("book-title").textContent = "";
    }
    book = b; index = i; chapter = b.chapters[i];
    store.set("last", chapter.id);
    store.set("last." + b.series + b.book, chapter.id);
    document.querySelectorAll("nav button").forEach(el => el.classList.toggle("active", el.dataset.id === chapter.id));
    $("chapter-id").textContent = chapter.id;
    $("chapter-title").textContent = chapter.title;
    document.title = `${chapter.title} — ${b.title}`;
    $("prev").disabled = i === 0;
    $("next").disabled = i === b.chapters.length - 1;
    current = -1;
    $("notice").innerHTML = "";
    textEl.textContent = "Loading…";
    try {
      renderText(await (await fetch(chapter.text)).text());
    } catch { textEl.textContent = "Couldn't load this chapter's text."; return; }
    if (chapter.audio) {
      audio.src = chapter.audio;
      audio.playbackRate = Number($("speed").value);
      await loadTimings(chapter);
      textEl.classList.toggle("untimed", mode === "none");
      if (mode === "none") $("notice").innerHTML = `<div class="notice">No timing file for this chapter, so the text won't follow the audio.</div>`;
      const pos = store.get("pos." + chapter.id, 0);
      audio.addEventListener("loadedmetadata", () => { if (pos > 2 && pos < audio.duration - 5) audio.currentTime = pos; }, { once: true });
      if (autoplay) audio.play().catch(() => {});
    } else {
      audio.removeAttribute("src"); audio.load();
      textEl.classList.add("untimed");
      $("notice").innerHTML = `<div class="notice">Audio for this chapter isn't ready yet. You can read it here.</div>`;
    }
    reader.scrollTo({ top: 0, behavior: "auto" });
  }

  function savePos() {
    if (chapter && chapter.audio && audio.currentTime > 0) store.set("pos." + chapter.id, Math.floor(audio.currentTime));
  }

  // ---------- controls ----------
  const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  function setPlayIcon() {
    $("play-icon").innerHTML = audio.paused ? PLAY : PAUSE;
    $("play").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
  }
  function toggle() { if (!audio.src) return; audio.paused ? audio.play().catch(() => {}) : audio.pause(); }

  $("play").onclick = toggle;
  $("back").onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 10); };
  $("fwd").onclick = () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); };
  $("prev").onclick = () => index > 0 && openChapter(book, index - 1, !audio.paused);
  $("next").onclick = () => index < book.chapters.length - 1 && openChapter(book, index + 1, !audio.paused);
  $("speed").onchange = e => { audio.playbackRate = Number(e.target.value); store.set("speed", e.target.value); };
  $("follow").onchange = e => store.set("follow", e.target.checked);
  $("toggle-chapters").onclick = () => $("chapters").classList.toggle("open");
  $("seek").oninput = e => { if (audio.duration) audio.currentTime = (e.target.value / 1000) * audio.duration; };
  textEl.addEventListener("click", e => {
    const i = e.target.dataset?.i;
    if (i === undefined || mode === "none" || !audio.src) return;
    audio.currentTime = words[i].t;
    if (audio.paused) audio.play().catch(() => {});
  });
  reader.addEventListener("wheel", () => { userScrollUntil = Date.now() + 4000; }, { passive: true });
  reader.addEventListener("touchmove", () => { userScrollUntil = Date.now() + 4000; }, { passive: true });
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    if (e.code === "ArrowLeft") $("back").click();
    if (e.code === "ArrowRight") $("fwd").click();
  });

  audio.addEventListener("play", setPlayIcon);
  audio.addEventListener("pause", () => { setPlayIcon(); savePos(); });
  audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); });
  audio.addEventListener("timeupdate", () => {
    $("cur").textContent = fmt(audio.currentTime);
    if (audio.duration) $("seek").value = Math.round((audio.currentTime / audio.duration) * 1000);
    if (mode !== "none" && words.length) highlight(wordAt(audio.currentTime));
    if (++saveTick % 20 === 0) savePos();
  });
  audio.addEventListener("ended", () => {
    store.set("pos." + chapter.id, 0);
    if (index < book.chapters.length - 1) openChapter(book, index + 1, true);
  });
  window.addEventListener("beforeunload", savePos);

  // ---------- start ----------
  (async () => {
    $("speed").value = store.get("speed", "1");
    $("follow").checked = store.get("follow", true);
    mediaStrip();
    // Sources: ?media=<url> for one media folder; otherwise library.json beside the page
    // ({"sources": ["/lorekiln-roa/", ...]}), each with its own manifest.json; otherwise media/.
    let sources = [MEDIA];
    if (!params.get("media")) {
      try {
        const lib = await fetch("library.json");
        if (lib.ok) sources = (await lib.json()).sources.map(s => s.replace(/\/?$/, "/"));
      } catch {}
    }
    manifest = { books: [] };
    for (const base of sources) {
      try {
        const m = await (await fetch(base + "manifest.json")).json();
        for (const b of m.books || []) {
          for (const c of b.chapters) for (const k of ["text", "audio", "ass", "timing"]) if (c[k]) c[k] = base + c[k];
          manifest.books.push(b);
        }
      } catch (e) { console.warn("no manifest at", base, e); }
    }
    manifest.books.sort((a, b) => a.title.localeCompare(b.title) || a.book - b.book);
    if (!manifest.books.length) {
      $("chapter-title").textContent = "No manifest found";
      textEl.innerHTML = `<p>Couldn't load a chapter list from ${sources.map(s => `<code>${s}manifest.json</code>`).join(", ")}.</p><p>On the workstation, run <code>tools\\preview_player.cmd</code> in the LoreKiln player folder. Anywhere else, add the media location to the address: <code>?media=https://…/</code></p>`;
      return;
    }
    if (!manifest.books?.length) { $("chapter-title").textContent = "No chapters in the manifest"; return; }
    buildSelect();
    const last = store.get("last", null);
    let b = manifest.books[0], i = 0;
    for (const bk of manifest.books) { const k = bk.chapters.findIndex(c => c.id === last); if (k >= 0) { b = bk; i = k; break; } }
    openChapter(b, i, false);
  })();
})();
</script>
</body>
</html>
